# Clave exclusiva para pruebas automatizadas
jwt.secret=financeia-test-secret-key-only-for-automated-tests-2026

# Base de datos en memoria utilizada exclusivamente durante las pruebas
spring.datasource.url=jdbc:h2:mem:financeia_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Las tablas de prueba se crean y eliminan automaticamente
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false

# Configuracion Data Science para pruebas
financeai.python.command=python
financeai.data-science.script=../../financeai-data-science/src/predict.py