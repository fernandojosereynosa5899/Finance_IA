version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - MYSQLUSER=${MYSQLUSER}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - JWT_SECRET=${JWT_SECRET:-my_super_secret_jwt_key_1234567890}

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    ports:
      - "4321:4321"
    environment:
      - PUBLIC_API_URL=http://localhost:8080
      - INTERNAL_API_URL=http://backend:8080
      - AUTH_SECRET=${AUTH_SECRET:-my_super_secret_auth_key_1234567890}
      - AUTH_TRUST_HOST=true
    depends_on:
      - backend